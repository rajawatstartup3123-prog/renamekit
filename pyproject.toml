[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renamekit"
version = "0.1.0"
description = "Safe bulk file renamer: preview by default, conflict checks, one-command undo."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["rename", "files", "cli", "bulk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]

[project.scripts]
renamekit = "renamekit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
